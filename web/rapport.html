<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex, nofollow">
<title>Feuille de route IA · PerfIA</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/perfia.css">
<style>
  body { background: var(--bg-alt); }
  .toolbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--ink-900); color: var(--on-dark); }
  .toolbar .t { flex: 1; font-weight: 700; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .toolbar .t span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toolbar .btn { min-height: 44px; padding: 8px 14px; }
  .toolbar a.close { color: var(--on-dark); text-decoration: none; font-size: 24px; padding: 0 6px; min-width: 44px; min-height: 44px; display: grid; place-items: center; }
  .sheet { max-width: 820px; margin: 18px auto 40px; background: var(--surface); border-radius: 6px; box-shadow: var(--shadow); padding: 28px 24px 32px; }
  .sheet-head { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; padding-bottom: 14px; border-bottom: 4px solid var(--accent-fill); }
  .sheet-head .logos { display: flex; flex-direction: column; gap: 10px; }
  .sheet-head .logos img.perfia { width: 54px; height: 54px; }
  .sheet-head .logos .row { display: flex; align-items: center; gap: 8px; }
  .sheet-head .logos .row img { height: 20px; width: auto; }
  .sheet-head .logos .row img.xylo { height: 24px; }
  .sheet-head .logos .row img.org { height: 26px; max-width: 80px; object-fit: contain; }
  .sheet-head h1 { font-size: clamp(26px, 5vw, 34px); text-align: right; }
  .sheet-head .date { text-align: right; color: var(--muted); margin: 6px 0 0; }
  .sec { margin: 26px 0 0; }
  .sec > h2 { display: flex; align-items: center; gap: 10px; font: 700 14px/1.2 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; margin: 0 0 14px; }
  .sec > h2::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--accent-fill); flex: none; }
  .who { display: grid; grid-template-columns: 9em 1fr; gap: 6px 12px; background: var(--surface-2); border-radius: 10px; padding: 14px 16px; margin: 0; }
  .who dt { color: var(--muted); } .who dd { margin: 0; font-weight: 700; }
  .axisbox { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 12px; break-inside: avoid; }
  .axisbox .h { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--accent-soft); border-radius: 10px 10px 0 0; }
  .axisbox .h .art { width: 52px; height: 52px; color: var(--accent); }
  .axisbox .h b { font-size: 17px; } .axisbox .h em { color: var(--accent); font-style: normal; font-weight: 700; }
  .axisbox ol { margin: 0; padding: 12px 16px 12px 36px; } .axisbox li { margin: 0 0 4px; }
  .matrix-wrap { max-width: 420px; margin: 0 auto; color: var(--ink); }
  .legend2 { list-style: none; padding: 0; margin: 12px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; font-size: 14px; }
  .legend2 li { display: flex; gap: 8px; align-items: baseline; break-inside: avoid; }
  .legend2 .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; transform: translateY(1px); }
  .legend2 .ep { margin-left: auto; font: 600 12px var(--font-mono); color: var(--muted); white-space: nowrap; }
  .tbl { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 12px; break-inside: avoid; }
  .tbl h3 { font-size: 16px; padding: 10px 14px; background: var(--accent-soft); border-radius: 10px 10px 0 0; margin: 0; font-family: var(--font-body); }
  .tbl table { width: 100%; border-collapse: collapse; }
  .tbl th { font: 700 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 8px 14px; }
  .tbl th:last-child, .tbl td:last-child { text-align: right; }
  .tbl td { border-top: 1px solid var(--line); padding: 7px 14px; font-size: 14px; }
  .tbl .adj { display: block; font-size: 12px; color: var(--muted); }
  .offer2 { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; margin: 0 0 10px; break-inside: avoid; }
  .offer2 b { display: block; }
  .sheet-foot { margin-top: 28px; padding-top: 12px; border-top: 4px solid var(--accent-fill); text-align: center; color: var(--muted); font-size: 13px; }
  .mailline { margin: 12px 0 0; font-size: 14px; color: var(--muted); }
  .mailline .linkbtn { padding: 4px 0; }
  .state { max-width: 520px; margin: 60px auto; padding: 0 16px; text-align: center; }
  @media (max-width: 420px) { .toolbar .t span { display: none; } }
  @media (max-width: 560px) { .legend2 { grid-template-columns: 1fr; } .who { grid-template-columns: 7em 1fr; } .sheet { padding: 20px 16px 24px; border-radius: 0; margin: 0; } }
  @page { size: A4; margin: 12mm; }
  @media print {
    body { background: var(--surface); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .toolbar, .no-print { display: none; }
    .sheet { box-shadow: none; margin: 0; max-width: none; padding: 0; }
    .sec { break-inside: auto; }
    .legend2 { grid-template-columns: 1fr 1fr; }
    a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 11px; color: var(--muted); }
  }
</style>
<script src="/js/ui.js" defer></script>
<script src="/js/rapport.js" defer></script>
</head>
<body>
<div class="toolbar">
  <span class="t"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg><span>Votre feuille de route IA</span></span>
  <button type="button" class="btn primary" id="print"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Imprimer / PDF</button>
  <a class="close" href="/" aria-label="Fermer et revenir au diagnostic">✕</a>
</div>
<main id="main"><p class="state muted">Chargement de votre feuille de route…</p></main>
</body>
</html>
