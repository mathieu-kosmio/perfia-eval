name: Dev

# Construit et publie l'image unique `app` (PocketBase + hooks + web) sur GHCR.
# Tag de l'image = contenu du fichier VERSION.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  docker-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lire la configuration du projet
        id: config
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "slug=$(grep '^PROJECT_SLUG=' infra/deploy/base/.env.base | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Propriétaire en minuscules
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Vérifier le Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint hadolint - < infra/docker/app/Dockerfile

      - name: Vérifier que les deux Dockerfiles sont identiques
        run: |
          if ! diff -q Dockerfile infra/docker/app/Dockerfile; then
            echo "Erreur : Dockerfile (racine, Coolify) et infra/docker/app/Dockerfile (CI) divergent."
            exit 1
          fi

      - name: Construire et publier l'image app
        run: |
          IMAGE="ghcr.io/${{ steps.owner.outputs.lc }}/${{ steps.config.outputs.slug }}-app:${{ steps.config.outputs.version }}"
          docker build --no-cache \
            -f infra/docker/app/Dockerfile \
            -t "$IMAGE" .
          docker push "$IMAGE"
