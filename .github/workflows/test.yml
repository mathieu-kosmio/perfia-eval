name: Tests

# Lance les tests d'intégration (instance PocketBase jetable, faux fournisseur IA) sur chaque push et pull request.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tests d'intégration
        run: make test
