# PerfIA Diagnostic IA sur Coolify : ressource « Docker Compose » pointée sur ce dépôt.
# Coolify gère le domaine, le TLS et le reverse proxy ; ne pas exposer de port sur l'hôte.
# Pour un déploiement Docker Compose + Traefik sans Coolify, voir infra/deploy/.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Coolify injecte le domaine de la ressource dans SERVICE_FQDN_APP_8090 (routage).
      # L'URL publique utilisée par les e-mails, l'OAuth et llms.txt se règle dans la console : Settings > Application.
      - SERVICE_FQDN_APP_8090
      # E-mails via l'API Brevo (optionnel) : clé en secret, expéditeur validé chez Brevo
      - APP_BREVO_API_KEY=${APP_BREVO_API_KEY:-}
      - APP_MAIL_FROM=${APP_MAIL_FROM:-}
      # Liste Brevo des participants qui acceptent les invitations (identifiant numérique, facultatif)
      - APP_BREVO_LIST_ID=${APP_BREVO_LIST_ID:-}
      # 0 coupe l'envoi des feuilles de route par e-mail (instance de test)
      - APP_SEND_REPORTS=${APP_SEND_REPORTS:-}
    volumes:
      - app_data:/pb/pb_data
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  app_data:
